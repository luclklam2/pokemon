<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#7598c2"/>
      <stop offset="100%" stop-color="#385174"/>
    </linearGradient>
    <pattern id="tiles" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#6487b3"/>
      <rect x="0" y="0" width="40" height="40" fill="#7ea6d0"/>
      <rect x="40" y="0" width="40" height="40" fill="#6f96c1"/>
      <rect x="0" y="40" width="40" height="40" fill="#5f83af"/>
      <rect x="40" y="40" width="40" height="40" fill="#5577a1"/>
      <rect x="0" y="0" width="80" height="6" fill="#d2e6ff" opacity=".22"/>
      <rect x="0" y="0" width="6" height="80" fill="#d2e6ff" opacity=".16"/>
      <rect x="74" y="0" width="6" height="80" fill="#2e4567" opacity=".45"/>
      <rect x="0" y="74" width="80" height="6" fill="#2e4567" opacity=".45"/>
    </pattern>
    <pattern id="marks" width="160" height="120" patternUnits="userSpaceOnUse">
      <rect width="160" height="120" fill="transparent"/>
      <rect x="18" y="18" width="124" height="8" fill="#9abbe1" opacity=".22"/>
      <rect x="18" y="94" width="124" height="8" fill="#9abbe1" opacity=".18"/>
      <rect x="72" y="26" width="16" height="68" fill="#ffd860" opacity=".55"/>
      <rect x="60" y="36" width="40" height="10" fill="#ffe8a2" opacity=".65"/>
      <rect x="60" y="74" width="40" height="10" fill="#ffe8a2" opacity=".65"/>
    </pattern>
  </defs>
  <rect width="800" height="480" fill="url(#bg)"/>
  <rect x="18" y="18" width="764" height="444" fill="url(#tiles)"/>
  <rect x="18" y="18" width="764" height="444" fill="url(#marks)"/>
  <rect x="18" y="18" width="764" height="444" fill="none" stroke="#dcecff" stroke-width="8" opacity=".35"/>
  <rect x="36" y="36" width="728" height="408" fill="none" stroke="#233954" stroke-width="10" opacity=".55"/>
</svg>
